<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Connect — Operator & Fan</title>
<meta name="description" content="BoltOS Connect: the club's Matchday Studio (operator) and the live fan panel, side by side." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#080b10; --stage:#0a0e14;
    --sky:#6cabdd; --sky-2:#9ecdeb; --sky-deep:#2b6f9e; --sky-glow:rgba(108,171,221,.5);
    --ink:#eef3f9; --ink-2:#aeb9c8; --muted:#7c8698;
    --good:#37d99b; --line:#1e2937;
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  ::-webkit-scrollbar{width:0;height:0}

  .wrap{min-height:100%;background:
    radial-gradient(80% 60% at 15% -5%, rgba(108,171,221,.10), transparent 60%),
    radial-gradient(70% 50% at 100% 0%, rgba(108,171,221,.06), transparent 60%),
    var(--stage);
    padding:22px 22px 26px;display:flex;flex-direction:column;gap:18px}

  .topstrip{display:flex;align-items:center;gap:12px;padding:0 4px}
  .bolt{display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:15px;letter-spacing:-.01em}
  .bolt .spark{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--sky),var(--sky-deep));display:flex;align-items:center;justify-content:center;color:#04121d;font-size:13px;box-shadow:0 4px 14px -4px var(--sky-glow)}
  .topstrip .dot{width:5px;height:5px;border-radius:50%;background:var(--muted)}
  .topstrip .lbl{font-size:12.5px;color:var(--ink-2);font-weight:500}
  .live{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.12em;color:#c9f3e2;background:rgba(55,217,155,.12);border:1px solid rgba(55,217,155,.35);padding:5px 11px;border-radius:100px}
  .live i{width:7px;height:7px;border-radius:50%;background:var(--good);animation:pulse 1.5s ease-in-out infinite}

  /* responsive flex — only the admin IFRAME is scaled (fan must stay un-transformed) */
  .scaler{display:flex;justify-content:center}
  .stage{width:100%;max-width:1400px;display:flex;gap:24px;align-items:stretch}
  .col-admin{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
  .col-fan{flex:0 0 340px;display:flex;flex-direction:column}

  .pane-cap{display:flex;align-items:center;gap:8px;margin:0 2px 10px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .pane-cap b{color:var(--sky-2);font-weight:700}

  .win{flex:1;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#0c1119;box-shadow:0 34px 80px -44px rgba(0,0,0,.85)}
  .win-bar{height:36px;display:flex;align-items:center;gap:8px;padding:0 14px;background:#0d121b;border-bottom:1px solid #1c2330}
  .win-bar .d{width:11px;height:11px;border-radius:50%;background:#2b3341}
  .win-bar .d.r{background:#ff6058}.win-bar .d.y{background:#ffbd2e}.win-bar .d.g{background:#28c840}
  .win-bar em{margin-left:12px;font-style:normal;font-size:12px;color:var(--muted);background:#070b11;padding:4px 14px;border-radius:7px}
  .admin-view{position:relative;height:820px;overflow:hidden;background:#eef1f6}
  .admin-view iframe{position:absolute;top:0;left:0;width:1180px;height:1040px;border:0;display:block;transform:scale(.7);transform-origin:top left}

  .phone{flex:1;position:relative;background:#05070b;border-radius:38px;padding:11px;border:1px solid #232c39;
    box-shadow:0 40px 90px -50px rgba(0,0,0,.9), inset 0 0 0 2px #0c1017}
  .phone::before{content:"";position:absolute;top:20px;left:50%;transform:translateX(-50%);width:104px;height:26px;background:#05070b;border-radius:16px;z-index:3}
  .phone iframe{width:100%;height:100%;min-height:786px;border:0;border-radius:30px;background:#0a0a0a;display:block;transform:translateZ(0);will-change:transform;backface-visibility:hidden}
  .cap-note{margin:11px 4px 0;font-size:11.5px;color:var(--muted);text-align:center}

  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,217,155,.55)}70%{box-shadow:0 0 0 7px rgba(55,217,155,0)}100%{box-shadow:0 0 0 0 rgba(55,217,155,0)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  /* stack on narrow screens */
  @media (max-width:840px){
    .stage{flex-direction:column;align-items:center}
    .col-admin{width:100%;max-width:560px}
    .col-fan{flex:0 0 auto;width:340px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topstrip">
    <span class="bolt"><span class="spark">✦</span>BoltOS Connect</span>
    <span class="dot"></span>
    <span class="lbl">Manchester City · Matchday</span>
    <span class="live"><i></i>LIVE</span>
  </div>

  <div class="scaler" id="scaler">
    <div class="stage" id="stage">
      <!-- ═══ OPERATOR — real Matchday Studio ═══ -->
      <div class="col-admin">
        <div class="pane-cap"><b>◑ Operator</b> — Matchday Studio (web)</div>
        <div class="win">
          <div class="win-bar"><span class="d r"></span><span class="d y"></span><span class="d g"></span><em>studio.boltos.ai</em></div>
          <div class="admin-view">
            <iframe id="adminframe" title="Matchday Studio — club operator" src="https://danielokpechi.github.io/immersive-panel-v2/autoplay/studio/?autoplay=1&embed=1&v=4" loading="eager"></iframe>
          </div>
        </div>
      </div>

      <!-- ═══ FAN — real live panel ═══ -->
      <div class="col-fan">
        <div class="pane-cap"><b>◐ Fan view</b> — supporters</div>
        <div class="phone">
          <iframe id="fanframe" title="Live fan panel" src="https://danielokpechi.github.io/immersive-panel-v2/autoplay/p/pnl-4471/?autoplay=1&embed=1&v=4" loading="eager" allow="autoplay"></iframe>
        </div>
        <div class="cap-note">Live embed — the panel fans use on matchday.</div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  // Scale ONLY the admin iframe to fit its (flex) column width. The fan phone
  // is never under a transformed ancestor, so it paints normally.
  var LOGW=1180, LOGH=1040;
  var av=document.querySelector('.admin-view'), ifr=document.getElementById('adminframe');
  function fit(){
    var w=av.clientWidth;
    if(!w) return;
    var as=Math.min(0.94, w/LOGW);
    ifr.style.transform='scale('+as+')';
    av.style.height=(LOGH*as)+'px';
  }
  window.addEventListener('resize',fit);
  window.addEventListener('load',fit);
  fit();
  var n=0,iv=setInterval(function(){fit();if(++n>6)clearInterval(iv);},500);
})();
</script>
</body>
</html>
